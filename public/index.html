<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Reminder Samsat</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-decor d1"></div>
    <div class="login-decor d2"></div>
    <div class="login-decor d3"></div>

    <div class="login-card">
      <div class="logo">
        <div class="logo-badge"><img src="/assets/logo.png" alt="Logo"></div>
      </div>
      <h1>Reminder Samsat</h1>
      <p class="subtitle">Sistem Pengingat Pajak Kendaraan Dinas</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <div id="loginError" style="font-size: 0.8rem; margin-bottom: 12px; display: none;"></div>
        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>

      <p class="login-foot">&copy; 2026 Reminder Samsat</p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
