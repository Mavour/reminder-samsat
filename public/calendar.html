<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender - Reminder Samsat</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" style="display:flex;align-items:center;gap:10px">
        <img src="/assets/logo.png" alt="Logo" style="width:38px;height:38px;border-radius:8px;object-fit:contain">
        <div>
          <h2>Reminder Samsat</h2>
          <small>Pajak Kendaraan Dinas</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span class="icon">&#127968;</span> Dashboard</a>
        <a href="/vehicles.html"><span class="icon">&#128663;</span> Kendaraan</a>
        <a href="/calendar.html" class="active"><span class="icon">&#128197;</span> Kalender</a>
        <a href="/notifications.html"><span class="icon">&#128276;</span> Notifikasi</a>
        <a href="/recipients.html"><span class="icon">&#128101;</span> Penerima</a>
        <a href="/settings.html"><span class="icon">&#9881;</span> Pengaturan</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="user-name" id="userName">Admin</div>
            <div class="user-role" id="userRole">Administrator</div>
          </div>
        </div>
        <button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">Keluar</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
        <h1>Kalender Pajak</h1>
      </div>

      <div class="content-area">
        <div class="card">
          <div class="cal-nav">
            <button class="btn btn-outline btn-sm" onclick="prevMonth()">&#10094; Sebelumnya</button>
            <h3 id="calMonthYear"></h3>
            <button class="btn btn-outline btn-sm" onclick="nextMonth()">Selanjutnya &#10095;</button>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="dayModal" style="display:none">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="dayDetailTitle">Detail Hari</h3>
        <button class="modal-close" onclick="closeDayDetail()">&times;</button>
      </div>
      <div class="modal-body" id="dayDetailBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline btn-sm" onclick="closeDayDetail()">Tutup</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    const user = getUser();
    document.getElementById('userName').textContent = user?.nama || 'User';
    document.getElementById('userRole').textContent = user?.role === 'admin' ? 'Administrator' : 'User';
    document.getElementById('userAvatar').textContent = (user?.nama || 'U')[0].toUpperCase();

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    });

    function logout() {
      clearAuth();
      window.location.href = '/';
    }

    const bulanIndo = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const hariIndo = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

    let currentDate = witaNow();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let allVehicles = [];

    async function loadVehicles() {
      try {
        allVehicles = await apiRequest('/vehicles');
        renderCalendar();
      } catch (err) {
        showToast('Gagal memuat data: ' + err.message, 'error');
      }
    }

    function getVehiclesForDay(day) {
      return allVehicles.filter(v => {
        if (!v.tanggal_pajak) return false;
        const p = parseTanggalPajak(v.tanggal_pajak);
        return p.d === day && p.m === currentMonth && p.y === currentYear;
      });
    }

    function getEventColor(v) {
      const p = parseTanggalPajak(v.tanggal_pajak);
      const t = witaNow();
      const pajakUTC = Date.UTC(p.y, p.m, p.d);
      const todayUTC = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
      const diffDays = Math.round((pajakUTC - todayUTC) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return 'red';
      if (diffDays <= 7) return 'orange';
      if (diffDays <= 30) return 'yellow';
      return '';
    }

    function renderCalendar() {
      document.getElementById('calMonthYear').textContent = bulanIndo[currentMonth] + ' ' + currentYear;

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

      let html = '';
      hariIndo.forEach(h => { html += '<div class="cal-header">' + h + '</div>'; });

      const today = witaNow();
      const isCurrentMonth = today.getMonth() === currentMonth && today.getFullYear() === currentYear;

      for (let i = 0; i < firstDay; i++) {
        const day = daysInPrevMonth - firstDay + i + 1;
        html += '<div class="cal-day other-month"><div class="day-number">' + day + '</div></div>';
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = isCurrentMonth && day === today.getDate();
        const cls = isToday ? 'cal-day today' : 'cal-day';
        const vehicles = getVehiclesForDay(day);

        html += '<div class="' + cls + '" style="cursor:pointer" onclick="showDayDetail(' + day + ')">';
        html += '<div class="day-number">' + day + '</div>';

        vehicles.forEach(v => {
          const color = getEventColor(v);
          const bgStyle = color === 'red' ? 'background:#fee2e2;color:#dc2626' :
                          color === 'orange' ? 'background:#ffedd5;color:#ea580c' :
                          color === 'yellow' ? 'background:#fef9c3;color:#ca8a04' :
                          'background:#fee2e2;color:#dc2626';
          html += '<div class="cal-event" style="' + bgStyle + '">' + v.nopol + '</div>';
        });

        html += '</div>';
      }

      const totalCells = firstDay + daysInMonth;
      const remaining = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        html += '<div class="cal-day other-month"><div class="day-number">' + i + '</div></div>';
      }

      document.getElementById('calendarGrid').innerHTML = html;
    }

    function showDayDetail(day) {
      const vehicles = getVehiclesForDay(day);
      const modal = document.getElementById('dayModal');
      const title = document.getElementById('dayDetailTitle');
      const body = document.getElementById('dayDetailBody');

      title.textContent = hariIndo[new Date(currentYear, currentMonth, day).getDay()] + ', ' + day + ' ' + bulanIndo[currentMonth] + ' ' + currentYear;

      if (vehicles.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="icon">&#128197;</div><p>Tidak ada pajak jatuh tempo pada hari ini</p></div>';
      } else {
        body.innerHTML = '<div style="margin-bottom:12px;color:var(--gray-500);font-size:0.85rem">&#128663; ' + vehicles.length + ' kendaraan jatuh tempo pada hari ini</div>' +
          '<div class="table-wrapper"><table><thead><tr><th>Nopol</th><th>Jenis</th><th>Merk</th><th>Ganti Plat</th><th>Jatuh Tempo</th><th>Estimasi</th><th>Status</th></tr></thead><tbody>' +
          vehicles.map(v => '<tr><td class="font-mono font-bold">' + v.nopol + '</td><td>' + v.jenis_kendaraan + '</td><td>' + (v.merk || '-') + '</td><td>' + (v.next_ganti_plat ? '<span class="badge ' + (v.ganti_plat_due_this_year ? 'badge-kritis' : 'badge-warning') + '">' + (v.ganti_plat_due_this_year ? 'Ganti Plat Tahun Ini' : 'Ganti Plat ' + v.next_ganti_plat) + '</span>' : '-') + '</td><td>' + formatDateFull(v.tanggal_pajak) + '</td><td>' + formatRupiah(v.total_estimasi_lengkap) + (v.biaya_ganti_plat > 0 ? '<div style="font-size:0.7rem;color:var(--gray-500)">termasuk ganti plat</div>' : '') + '</td><td><span class="badge badge-' + v.status + '">' + v.status_label + '</span></td></tr>').join('') +
          '</tbody></table></div>';
      }

      modal.style.display = 'flex';
    }

    function closeDayDetail() {
      document.getElementById('dayModal').style.display = 'none';
    }

    document.getElementById('dayModal').addEventListener('click', function(e) {
      if (e.target === this) closeDayDetail();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeDayDetail();
    });

    function prevMonth() {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    }

    function nextMonth() {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    loadVehicles();
  </script>
</body>
</html>
