<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kendaraan - Reminder Samsat</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>


  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" style="display:flex;align-items:center;gap:10px">
        <img src="/assets/logo.png" alt="Logo" style="width:38px;height:38px;border-radius:8px;object-fit:contain">
        <div>
          <h2>Reminder Samsat</h2>
          <small>Pajak Kendaraan Dinas</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span class="icon">&#127968;</span> Dashboard</a>
        <a href="/vehicles.html" class="active"><span class="icon">&#128663;</span> Kendaraan</a>
        <a href="/notifications.html"><span class="icon">&#128276;</span> Notifikasi</a>
        <a href="/recipients.html"><span class="icon">&#128101;</span> Penerima</a>
        <a href="/settings.html"><span class="icon">&#9881;</span> Pengaturan</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="user-name" id="userName">Admin</div>
            <div class="user-role" id="userRole">Administrator</div>
          </div>
        </div>
        <button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">Keluar</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        
        <h1>Edit Kendaraan</h1>
        <a href="/vehicles.html" class="btn btn-outline btn-sm">&#8592; Kembali</a>
        <div class="user-menu">
          <button class="user-menu-btn" onclick="toggleUserMenu(event)" title="Menu Profil">
            <img src="/assets/logo.png" alt="Avatar">
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-info">
              <div class="user-menu-name">User</div>
              <div class="user-menu-role"></div>
            </div>
            <button class="user-menu-item" onclick="logout()">&#128682; Keluar</button>
          </div>
        </div>
      </div>

      <div class="content-area">
        <div class="card">
          <div class="card-body">
            <div id="loadingState" class="text-center" style="padding:40px">
              <span class="loading-spinner"></span>
            </div>

            <form id="vehicleForm" onsubmit="submitForm(event)" style="display:none">
              <div class="form-group">
                <label for="nopol">Nomor Polisi *</label>
                <input type="text" id="nopol" name="nopol" required placeholder="Contoh: B 1234 CD">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="jenis_kendaraan">Jenis Kendaraan *</label>
                  <select id="jenis_kendaraan" name="jenis_kendaraan" required>
                    <option value="">-- Pilih Jenis --</option>
                    <option value="Mobil">Mobil</option>
                    <option value="Motor">Motor</option>
                    <option value="Truk">Truk</option>
                    <option value="Bus">Bus</option>
                    <option value="Lainnya">Lainnya</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="merk">Merk / Tipe</label>
                  <input type="text" id="merk" name="merk" placeholder="Contoh: Toyota Avanza">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="tahun">Tahun</label>
                  <input type="number" id="tahun" name="tahun" placeholder="Contoh: 2022" min="1900" max="2099">
                </div>
                <div class="form-group">
                  <label for="warna">Warna</label>
                  <input type="text" id="warna" name="warna" placeholder="Contoh: Putih">
                </div>
              </div>

              <div class="form-group">
                <label for="tanggal_pajak">Tanggal Jatuh Tempo Pajak *</label>
                <input type="date" id="tanggal_pajak" name="tanggal_pajak" required>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="estimasi_pkb">Estimasi PKB (Rp)</label>
                  <input type="number" id="estimasi_pkb" name="estimasi_pkb" placeholder="0" min="0">
                </div>
                <div class="form-group">
                  <label for="estimasi_opsen_pkb">Opsen PKB (Rp)</label>
                  <input type="number" id="estimasi_opsen_pkb" name="estimasi_opsen_pkb" placeholder="0" min="0">
                </div>
                <div class="form-group">
                  <label for="estimasi_swdkllj">Estimasi SWDKLLJ (Rp)</label>
                  <input type="number" id="estimasi_swdkllj" name="estimasi_swdkllj" placeholder="0" min="0">
                </div>
              </div>

              <div class="form-group">
                <label for="catatan">Catatan</label>
                <textarea id="catatan" name="catatan" rows="3" placeholder="Catatan tambahan..."></textarea>
              </div>

              <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">
                <button type="submit" class="btn btn-primary" id="submitBtn">&#10003; Simpan Perubahan</button>
                <button type="button" class="btn btn-success" id="paidBtn" onclick="markPaid()">&#10003; Tandai Sudah Bayar</button>
                <a href="/vehicles.html" class="btn btn-outline">Batal</a>
              </div>
            </form>
          </div>
        </div>

        <div class="card" style="margin-top:16px">
          <div class="card-header"><h2>&#128197; Riwayat Pembayaran</h2></div>
          <div class="card-body" id="payHistoryBox"><p style="color:var(--gray-500)">Memuat...</p></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <nav class="bottom-nav">
    <a href="/dashboard.html"><span class="icon">&#127968;</span>Dashboard</a>
    <a href="/vehicles.html" class="active"><span class="icon">&#128663;</span>Kendaraan</a>
    <a href="/notifications.html"><span class="icon">&#128276;</span>Notifikasi</a>
    <a href="/recipients.html"><span class="icon">&#128101;</span>Penerima</a>
    <a href="/settings.html"><span class="icon">&#9881;</span>Pengaturan</a>
  </nav>


  <script src="js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    const user = getUser();
    document.getElementById('userName').textContent = user?.nama || 'User';
    document.getElementById('userRole').textContent = user?.role === 'admin' ? 'Administrator' : 'User';
    document.getElementById('userAvatar').textContent = (user?.nama || 'U')[0].toUpperCase();


    function logout() {
      clearAuth();
      window.location.href = '/';
    }

    const params = new URLSearchParams(window.location.search);
    const vehicleId = params.get('id');

    if (!vehicleId) {
      window.location.href = '/vehicles.html';
    }

    async function loadVehicle() {
      try {
        const vehicle = await apiRequest(`/vehicles/${vehicleId}`);

        document.getElementById('nopol').value = vehicle.nopol || '';
        document.getElementById('jenis_kendaraan').value = vehicle.jenis_kendaraan || '';
        document.getElementById('merk').value = vehicle.merk || '';
        document.getElementById('tahun').value = vehicle.tahun || '';
        document.getElementById('warna').value = vehicle.warna || '';
        document.getElementById('tanggal_pajak').value = vehicle.tanggal_pajak ? vehicle.tanggal_pajak.split('T')[0] : '';
        document.getElementById('estimasi_pkb').value = vehicle.estimasi_pkb || '';
        document.getElementById('estimasi_opsen_pkb').value = vehicle.estimasi_opsen_pkb || '';
        document.getElementById('estimasi_swdkllj').value = vehicle.estimasi_swdkllj || '';
        document.getElementById('catatan').value = vehicle.catatan || '';

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('vehicleForm').style.display = 'block';
        loadHistory();
      } catch (err) {
        showToast('Gagal memuat data kendaraan: ' + err.message, 'error');
        setTimeout(() => {
          window.location.href = '/vehicles.html';
        }, 2000);
      }
    }

    async function loadHistory() {
      const box = document.getElementById('payHistoryBox');
      try {
        const hist = await apiRequest(`/vehicles/${vehicleId}/payments`);
        if (hist.length === 0) {
          box.innerHTML = '<p style="color:var(--gray-500)">Belum ada riwayat pembayaran. Klik "Tandai Sudah Bayar" setelah pajak diperpanjang.</p>';
          return;
        }
        box.innerHTML = '<div class="table-wrapper"><table><thead><tr><th>Tgl Bayar</th><th>Tempo Lama</th><th>Tempo Baru</th><th>Oleh</th><th>Catatan</th></tr></thead><tbody>' +
          hist.map(h => '<tr><td>' + escapeHtml(h.tanggal_bayar || '-') + '</td><td>' + escapeHtml(h.tanggal_pajak_lama || '-') + '</td><td><strong>' + escapeHtml(h.tanggal_pajak_baru) + '</strong></td><td>' + escapeHtml(h.dibayar_oleh_nama || '-') + '</td><td>' + escapeHtml(h.catatan || '-') + '</td></tr>').join('') +
          '</tbody></table></div>';
      } catch (e) {
        box.innerHTML = '<p style="color:var(--danger)">Gagal memuat riwayat.</p>';
      }
    }

    async function markPaid() {
      const lama = document.getElementById('tanggal_pajak').value;
      let baru = '';
      if (lama) {
        const p = lama.split('-');
        baru = (parseInt(p[0], 10) + 1) + '-' + p[1] + '-' + p[2];
      }
      const ok = await showConfirm(
        'Tandai <strong>' + escapeHtml(document.getElementById('nopol').value) + '</strong> sudah dibayar?<br>Jatuh tempo: ' + escapeHtml(lama) + ' &#8594; <strong>' + escapeHtml(baru) + '</strong>',
        { title: 'Sudah Bayar?', confirmText: 'Ya, Sudah Bayar' }
      );
      if (!ok) return;
      try {
        const res = await apiRequest(`/vehicles/${vehicleId}/mark-paid`, { method: 'POST', body: JSON.stringify({}) });
        showToast(res.message || 'Berhasil!', 'success');
        loadVehicle();
      } catch (err) {
        showToast('Gagal: ' + err.message, 'error');
      }
    }

    async function submitForm(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const form = document.getElementById('vehicleForm');
      const formData = new FormData(form);
      const body = {};

      formData.forEach((value, key) => {
        if (value !== '') {
          body[key] = ['estimasi_pkb', 'estimasi_opsen_pkb', 'estimasi_swdkllj', 'tahun'].includes(key)
            ? Number(value)
            : value;
        }
      });

      try {
        await apiRequest(`/vehicles/${vehicleId}`, {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        showToast('Kendaraan berhasil diperbarui!', 'success');
        setTimeout(() => {
          window.location.href = '/vehicles.html';
        }, 1000);
      } catch (err) {
        showToast('Gagal menyimpan: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '\u2713 Simpan Perubahan';
      }
    }

    loadVehicle();
  </script>
</body>
</html>
