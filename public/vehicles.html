<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kendaraan - Reminder Samsat</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" style="display:flex;align-items:center;gap:10px">
        <img src="/assets/logo.png" alt="Logo" style="width:38px;height:38px;border-radius:8px;object-fit:contain">
        <div>
          <h2>Reminder Samsat</h2>
          <small>Pajak Kendaraan Dinas</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span class="icon">&#127968;</span> Dashboard</a>
        <a href="/vehicles.html" class="active"><span class="icon">&#128663;</span> Kendaraan</a>
        <a href="/calendar.html"><span class="icon">&#128197;</span> Kalender</a>
        <a href="/notifications.html"><span class="icon">&#128276;</span> Notifikasi</a>
        <a href="/recipients.html"><span class="icon">&#128101;</span> Penerima</a>
        <a href="/settings.html"><span class="icon">&#9881;</span> Pengaturan</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="user-name" id="userName">Admin</div>
            <div class="user-role" id="userRole">Administrator</div>
          </div>
        </div>
        <button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">Keluar</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
        <h1>Daftar Kendaraan</h1>
      </div>

      <div class="content-area">
        <div class="card">
          <div class="card-header">
            <div class="search-bar">
              <input type="text" id="searchInput" placeholder="Cari nopol, jenis, merk..." oninput="filterVehicles()">
              <select id="statusFilter" onchange="filterVehicles()">
                <option value="">Semua Status</option>
                <option value="aman">Aman</option>
                <option value="warning">Perlu Perhatian</option>
                <option value="mendesak">Mendesak</option>
                <option value="kritis">Kritis</option>
                <option value="lewat">Lewat Tempo</option>
              </select>
            </div>
            <a href="/add-vehicle.html" class="btn btn-primary btn-sm" style="width:auto;flex-shrink:0">Tambah</a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nopol</th>
                  <th>Jenis</th>
                  <th>Merk/Tahun</th>
                  <th>Pemilik</th>
                  <th>Jatuh Tempo</th>
                  <th>Estimasi</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="vehicleBody">
                <tr><td colspan="8" class="text-center" style="padding:40px"><span class="loading-spinner"></span></td></tr>
              </tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" style="display:none">
            <div class="icon">&#128663;</div>
            <p>Belum ada data kendaraan</p>
            <a href="/add-vehicle.html" class="btn btn-primary btn-sm" style="margin-top:12px">+ Tambah Kendaraan</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');

    const user = getUser();
    document.getElementById('userName').textContent = user?.nama || 'User';
    document.getElementById('userRole').textContent = user?.role === 'admin' ? 'Administrator' : 'User';
    document.getElementById('userAvatar').textContent = (user?.nama || 'U')[0].toUpperCase();

    let allVehicles = [];

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    });

    function logout() {
      clearAuth();
      window.location.href = '/';
    }

    function renderVehicles(vehicles) {
      const tbody = document.getElementById('vehicleBody');
      const emptyState = document.getElementById('emptyState');

      if (vehicles.length === 0) {
        tbody.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      tbody.innerHTML = vehicles.map(v => `
        <tr>
          <td class="font-mono font-bold">${v.nopol}</td>
          <td>${v.jenis_kendaraan}</td>
          <td>${v.merk || '-'} ${v.tahun || ''}</td>
          <td>${v.user_nama || '-'}</td>
          <td>${formatDateFull(v.tanggal_pajak)}</td>
          <td>${formatRupiah(v.total_estimasi)}</td>
          <td><span class="badge badge-${v.status}">${v.status_label}</span></td>
          <td>
            <div class="actions-cell">
              <a href="/edit-vehicle.html?id=${v.id}" class="btn btn-outline btn-sm">&#9998;</a>
              <button class="btn btn-success btn-sm" onclick="sendReminder(${v.id})" title="Kirim Reminder WA">&#128276;</button>
              <button class="btn btn-danger btn-sm" onclick="deleteVehicle(${v.id}, '${v.nopol}')" title="Hapus">&#128465;</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterVehicles() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = allVehicles;

      if (search) {
        filtered = filtered.filter(v =>
          v.nopol.toLowerCase().includes(search) ||
          (v.jenis_kendaraan && v.jenis_kendaraan.toLowerCase().includes(search)) ||
          (v.merk && v.merk.toLowerCase().includes(search)) ||
          (v.user_nama && v.user_nama.toLowerCase().includes(search))
        );
      }

      if (status) {
        filtered = filtered.filter(v => v.status === status);
      }

      renderVehicles(filtered);
    }

    async function sendReminder(id) {
      if (!confirm('Kirim reminder WhatsApp sekarang?')) return;
      try {
        const data = await apiRequest(`/reminders/send/${id}`, { method: 'POST' });
        showToast('Pesan reminder berhasil dikirim!', 'success');
      } catch (err) {
        showToast('Gagal kirim: ' + err.message, 'error');
      }
    }

    async function deleteVehicle(id, nopol) {
      if (!confirm(`Hapus kendaraan ${nopol}?`)) return;
      try {
        await apiRequest(`/vehicles/${id}`, { method: 'DELETE' });
        showToast('Kendaraan berhasil dihapus.', 'success');
        loadVehicles();
      } catch (err) {
        showToast('Gagal hapus: ' + err.message, 'error');
      }
    }

    async function loadVehicles() {
      try {
        allVehicles = await apiRequest('/vehicles');
        renderVehicles(allVehicles);
      } catch (err) {
        showToast('Gagal memuat data: ' + err.message, 'error');
      }
    }

    loadVehicles();
  </script>
</body>
</html>
